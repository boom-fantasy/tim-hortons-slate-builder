# Two cron services share this image. Each one's start command and cron
# schedule are set in the Railway dashboard, NOT here: settings in this file
# override the dashboard for every service built from the repo, so a
# startCommand here would make both services run the same command.
#
#   slate-build : 0 2,3 * * *    -> python -m src.main build --scheduled
#   slate-drift : 30 13,14 * * * -> python -m src.main drift --scheduled
#
# Cron on Railway is UTC-only. Each service fires at both UTC hours its
# Eastern time can land on; --scheduled makes the job exit at once unless the
# local hour matches slate.build_hour / slate.drift_hour in config.yaml. So the
# build is 10pm ET and drift 9:30am ET all year, with no DST edits.

[build]
builder = "dockerfile"

[deploy]
# One-shot jobs: run, exit, never restart. Required for cron services.
restartPolicyType = "never"
