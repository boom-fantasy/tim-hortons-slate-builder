# =============================================================================
# Hockey Challenge — Slate Builder config
#
# Everything tunable lives here. Changing a value here changes behaviour on the
# next run with no code change and no redeploy of logic.
#
# Commit every change to this file. When you reconcile projected vs. actual
# later in the season, git history tells you what the bands were on any night.
# =============================================================================

# -----------------------------------------------------------------------------
# Contest economics
# -----------------------------------------------------------------------------
contest:
  # Points awarded for exactly N correct picks. Index 0 = 0 correct.
  # Regular season 2026-27: 10 / 25 / 100 (was 25 / 50 / 100 in playoffs).
  payouts: [0, 10, 25, 100]

  # Target share of users landing on exactly N correct. Index 0 = 0 correct.
  #
  # Confirmed for the 2026-27 regular season: 46% / 13% / 1% on the winning
  # buckets, so 40% get nothing. Implies a budget of 8.85 points per user per
  # day and 0.75 expected correct picks.
  targets: [0.40, 0.46, 0.13, 0.01]

  # Max players per tier that actually make the contest. Pools larger than this
  # get randomly sampled down, which dilutes the top-of-tier probability a
  # sharp user actually sees. Set to null to disable dilution modelling.
  max_players_per_tier: 15

  # Real results vs the model. Actual any-correct has run this far ABOVE the
  # model's average-user line (week 1: +1.3 pts, week 2: +1.7 pts), so the
  # verdict and the Slack "estimated win rate" use average + this. Re-measure
  # it each week against the reported win rate and update if it drifts.
  actual_offset: 0.015

# -----------------------------------------------------------------------------
# Tier bands — American odds, inclusive on both ends
#
# A player is assigned to the first tier whose range contains their odds.
# Anything outside every range is excluded from the slate.
#
# Week 2 change (from 10/13). Week 1 (9/28–10/4) came in at 50.73% any-correct
# and week 2 (10/5–10/11) at 52.74%, against a 60% target. A backtest of all 14
# slates showed actual results track the model's AVERAGE-user line plus ~1.5
# points — not the sharp line the earlier bands were tuned to.
#
# These bands move shorter again and work together with slate.selection
# (below): together they project ~57% actual, deliberately short of 60% to
# stay under the points budget while results are measured. Judge it on the
# weekly figure — nightly results are noisier now that the strongest players
# are always submitted and picks may cluster on them.
#
# History:
#   9/28–10/4:   T1 +150–290,  T2 +291–540,  T3 +541–900   -> 50.73%
#   10/5–10/11:  T1 +105–270,  T2 +271–520,  T3 +521–1000  -> 52.74%
#
# The Calibration v2 template has its own band cells — keep them identical.
# -----------------------------------------------------------------------------
tiers:
  - tier: 1
    min_odds: 100
    max_odds: 230
  - tier: 2
    min_odds: 231
    max_odds: 450
  - tier: 3
    min_odds: 451
    max_odds: 850

# -----------------------------------------------------------------------------
# Odds handling
# -----------------------------------------------------------------------------
odds:
  # Overround to strip from implied probability. Anytime-goalscorer markets
  # typically carry 5-8%. Lower this if you switch to a sharper book.
  devig: 0.06

  # Primary sportsbook, as OpticOdds names it. Every game is priced from this
  # book when it has a market for that game.
  sportsbook: draftkings

  # Fallbacks, tried in order, PER GAME, only when every book before them has
  # no market for that game. A game is always priced entirely by one book —
  # never a mix — so players in the same game are compared on one set of
  # prices. Games priced by a backup are named in the Slack summary.
  # (2026-10-01: DraftKings posted nothing for 10/02; FanDuel had full rosters.)
  backup_sportsbooks: [fanduel]

# -----------------------------------------------------------------------------
# OpticOdds lookups
#
# VERIFY BOTH OF THESE BEFORE THE FIRST LIVE RUN. OpticOdds uses canonical
# slugs, not short codes, and guessing returns empty results silently.
#
#   python -m src.main discover --sport hockey
#
# will print the valid league slugs and the goalscorer market key for
# DraftKings so you can paste the right values in here.
# -----------------------------------------------------------------------------
optic_odds:
  base_url: https://api.opticodds.com
  sport: hockey
  league: nhl                # verified 2026-09-22 via /api/v3/leagues
  market: anytime_goal_scorer  # verified 2026-09-22 at DraftKings (player_goals is the O/U variant)
  timeout_seconds: 30
  max_retries: 3

# -----------------------------------------------------------------------------
# Slate construction rules
# -----------------------------------------------------------------------------
slate:
  # If a scheduled game has no goalscorer market at pull time, drop the whole
  # game rather than writing a partial pool for it. A half-populated game
  # skews the pool toward whichever players happened to be priced first.
  drop_games_without_market: true

  # Warn in Slack if fewer than this share of the night's games came back with
  # a market. Partial coverage biases the pool toward marquee games, which run
  # hotter than the average game.
  coverage_warn_threshold: 0.80

  # Flag a slate where one team holds more than this share of T1+T2 players.
  # Correlated picks fatten the tails, and the 3-correct bucket now pays 10x
  # the 1-correct bucket, so the tail matters more than it did last season.
  team_concentration_warn: 0.60

  # Timezone used to decide which calendar day "tomorrow" is, and which local
  # day a game belongs to.
  timezone: America/New_York

  # Local hours (in `timezone`) the scheduled runs happen. Railway cron is
  # UTC-only, so each service is scheduled at BOTH UTC hours its local time
  # can fall on, and runs started with --scheduled skip the one that does not
  # match today. Result: same local time all year, nothing to change at DST.
  #
  #   build 22 (10pm ET) -> cron  0 2,3 * * *   build --scheduled
  #   drift  9 (9:30am)  -> cron 30 13,14 * * * drift --scheduled
  #
  # Changing an hour here means changing the cron hours to match: they are
  # this hour +4 and +5 for Eastern.
  build_hour: 22
  drift_hour: 9

  # Who is submitted to the contest in each tier (from 10/13).
  #
  #   all     everyone in the band — the behaviour through 10/12
  #   top     the `submitted_per_tier` most likely to score
  #   spread  the `spread_top` most likely, plus the remaining slots spread
  #           evenly down the rest of the pool to its weakest player
  #
  # spread keeps a deliberate mix of strong, middling and weak options in every
  # tier, so picking well still matters and a weak pick can still lose. Pools
  # at or under `submitted_per_tier` are submitted whole (quiet nights do not
  # change). Players tied on odds at the top cut are all kept. Unselected
  # players are tier 4 in the paste tab and left off the slate tab.
  #
  # Raising spread_top (e.g. 3 -> 5 -> 10) is the main knob for moving the win
  # rate up from here; lowering it, or raising submitted_per_tier, moves it down.
  selection: spread
  submitted_per_tier: 20
  spread_top: 3

  # Players from the night's FINAL start time, per tier. The contest drops
  # players as their games start, so late in the evening only the last
  # game(s)' players remain — a tier with none of them cannot be picked in at
  # all. After the selection above, any tier short of this gets more players
  # from the final game(s) added back (spread strongest to weakest); nobody is
  # removed, so a tier can end up a little over submitted_per_tier. If the
  # final game has too few players in a band, Slack warns. (Added 10/15.)
  late_game_min_per_tier: 3

# -----------------------------------------------------------------------------
# Historical fallback
#
# When a whole game has no goalscorer market at pull time, estimate its players
# from their recent prices instead of dropping them.
#
# Recent prices come from our own store (sheets.price_history_tab), not the
# API — the key has no access to historical odds. Both build and drift write to
# it every run whether or not this is enabled, so the store is filling up while
# the fallback is off.
#
# This runs ONLY at the game level. If a game IS priced and a player is simply
# absent from it, that absence is a real signal — DraftKings priced everyone
# they expect to dress, so a missing player is scratched or hurt. Those players
# are always dropped, never estimated.
# -----------------------------------------------------------------------------
fallback:
  # OFF for the start of the 2026-27 season.
  #
  # The store only starts filling on opening night, so for the first couple of
  # weeks no team has min_stored_games in it and the fallback would decline
  # every game anyway (and say so in Slack).
  #
  # Turn on once teams have ~5 regular-season games in — mid-October.
  # An unpriced game drops entirely while this is off, which is more honest
  # than a wrong tier.
  enabled: false

  # How many of the team's recent stored games to look back over.
  # Fewer is noisier; more washes out line changes and role shifts, which move
  # goalscorer prices a lot. Also sets how much the store keeps: it is pruned
  # to this many games per team.
  lookback_games: 5

  # A team is only estimated once the store holds at least this many of its
  # games. Below that the game is left out and Slack says why ("Bruins: 2 of 5
  # games stored"), rather than quietly averaging over one game.
  #
  # This is a TEAM-level gate on how much history exists. Within a team that
  # passes it, a player priced in fewer of those games (a call-up, someone
  # back from injury) is still estimated from however many they have.
  #
  # The price stored per game is the earliest one we captured — normally the
  # 10pm build, else the 9:30am drift run. There is no opening/closing choice
  # any more; we keep whatever existed when we ran.
  min_stored_games: 2        # TEMPORARY (set 2026-09-22) — revisit once `accuracy` has data

  # Require the player to have been priced in their most recent game.
  #
  # Completed games have all been priced, so a player missing from one was
  # scratched — a real signal, not a gap in the book's posting schedule. They
  # are likely still out, so they are dropped rather than estimated.
  #
  # This is the conservative call and deliberately so: leaving out a star who
  # would have played is a minor loss, while including one who does not dress
  # hands the user a pick with no chance of hitting.
  #
  # Games we never CAPTURED (unpriced at both runs, or a failed run) are a
  # different thing — that is our gap, not evidence about any player — so they
  # are simply absent from the store and the check falls to the next game back.
  require_recent_appearance: true

  # Ignore games before this date when looking back.
  #
  # Preseason prices are a bad basis for regular-season tiering — lineups are
  # full of prospects who will not be on the roster and regulars play limited
  # minutes — so a confident-looking estimate built on them is worse than
  # dropping the game. Set this to the regular-season opener.
  #
  # This self-heals: on opening night a team has no eligible history and their
  # unpriced games drop, and by mid-October they have a full window again.
  # Nothing to remember to switch back on.
  #
  # Set to null to look back without a floor.
  earliest_game_date: "2026-09-29"

  # Second line of defence: prices from fixtures with these season types are
  # never written to the store. The feed labels NHL fixtures "Preseason" and
  # "Playoffs" (seen 2026-09-22); matched case-insensitively.
  exclude_season_types: [preseason, exhibition, prospect]

  # Appended to the player's name in the sheet so estimated rows are obvious on
  # review. Set to "" to disable.
  marker: " (est)"

# -----------------------------------------------------------------------------
# Season roster
#
# Once a player is on a team's list they stay on it for the whole season,
# priced or not — the contest sheet looks players up by name, and a name that
# vanished would break its formulas. Anyone without a usable price on a given
# night is tier 4 (listed, not selectable). Tier 4 lists grow over the season;
# that is expected.
#
# The ONLY way off a team's list is a team change: the player moves to the new
# team's list the same night, and the Slack summary reports it.
# -----------------------------------------------------------------------------
roster:
  enabled: true

  # Sync every team's list from the players endpoint each night (all 32 teams,
  # not only those playing). Adds new players (call-ups, signings — listed in
  # Slack), moves traded players to their new team (listed in Slack), never
  # removes anyone. Off means the roster only learns players as they get priced.
  seed_from_api: true

  # Goalies never carry a goalscorer price, so they would sit at tier 4 all
  # season doing nothing. Skipped by the sync where the feed exposes position.
  exclude_positions: [G, GOALIE, GOALTENDER]

  # Warn when a hand-added player has never matched a priced player after this
  # many days. A typo'd name looks identical to a player who simply is not being
  # priced, and this is the only way to tell them apart.
  manual_unmatched_warn_days: 14

  # Hidden tab holding the roster. Safe to hand-edit: add a row with team and
  # player name, leave player_id blank, set source to "manual". The job fills in
  # the id once it sees a priced player with that name.
  tab: "_roster"

# -----------------------------------------------------------------------------
# Google Sheets output
# -----------------------------------------------------------------------------
sheets:
  # Tab your team copies from, laid out to match the contest-creation sheet:
  # two columns per team (Player Name, Tier) with a spacer column between,
  # teams left-to-right alphabetically by location. A blank row separates
  # tiers 1-3 from tier 4 within each team.
  paste_tab_format: "Paste %Y-%m-%d"

  # Pad every team's tier 1-3 block to the same height so the blank row and the
  # tier 4 block line up across columns. Off means each column closes up tight
  # and the break lands wherever that team's tier 3 ends — which puts one
  # team's tier 4 alongside another's gap when you scan across.
  align_tier_break: true

  # Hidden tab holding the estimate-accuracy log.
  #
  # `build` appends a row for every estimated player with the estimate it made.
  # `drift` fills in the actual price once the market posts. The gap
  # between the two is the only evidence you get about whether the historical
  # fallback is any good — without it the estimates look plausible and nothing
  # ever contradicts them.
  #
  # Run `python -m src.main accuracy` to roll it up.
  estimate_log_tab: "_estimate_log"

  # Hidden tab holding every live goalscorer price we have captured — the
  # fallback's only source of history. Columns: date, fixture_id, player_id,
  # player, team, american_odds. One row per (fixture_id, player_id), earliest
  # capture kept. Pruned each build to lookback_games games per team.
  price_history_tab: "_price_history"

  # Hidden tab holding every morning drift check, kept all season (never
  # pruned). One row per locked player per day: date, player, team, source
  # (live / est), locked_odds, locked_tier, current_odds, current_tier,
  # prob_move (signed share, e.g. -0.25), flag (moved / not_priced / blank).
  # Every player is logged, not only flagged ones, so rates have a denominator.
  drift_log_tab: "_drift_log"

  # The master workbook. Share it with the service account as an Editor.
  spreadsheet_id: "1Q3esYoc8VjfPQBj8hd9zt1JeCMr0Ws8LuloxYCjhgVo"

  # Tab that gets copied for each night's slate. Keep its formulas intact —
  # the script writes only columns A-D and lets the sheet compute the rest.
  template_tab: "Calibration v2"

  # strftime pattern for the new tab's name.
  tab_name_format: "Slate %Y-%m-%d"

  # First row of the player table, and the columns the script writes.
  first_data_row: 8
  columns:
    player: A
    team: B
    opponent: C
    odds: D

  # Where the script stamps slate metadata.
  date_cell: B3
  games_cell: E3

# -----------------------------------------------------------------------------
# Slack
# -----------------------------------------------------------------------------
slack:
  enabled: true
  channel: "#dfs-operations"
  # Bot token comes from the SLACK_BOT_TOKEN env var, never from this file.

# -----------------------------------------------------------------------------
# Post-lock drift check
#
# The slate locks when the contest is generated, so this cannot fix anything.
# It is measurement only: it tells you how often a locked slate had a player
# scratched or repriced after the fact, which is the error term you need when
# comparing projected payout against actual.
# -----------------------------------------------------------------------------
drift_check:
  enabled: true
  # Flag a player whose true probability moved more than this share.
  move_threshold: 0.20

  # Post the morning drift summary to Slack. Off: the run still records prices,
  # scores estimates and logs the movement check — it just does it quietly.
  slack: false
